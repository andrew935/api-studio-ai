x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/api_studio_ai
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ISSUER: ${JWT_ISSUER:-api-studio-ai}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-api-studio-ai-api}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MCP_SERVER_URL: ${MCP_SERVER_URL:-http://localhost:8001/mcp}
  MCP_AUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL:-http://localhost:8000}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  LOCAL_STORAGE_PATH: /app/storage/uploads
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-15}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_CIRCUIT_FAILURE_THRESHOLD: ${S3_CIRCUIT_FAILURE_THRESHOLD:-3}
  S3_CIRCUIT_RECOVERY_SECONDS: ${S3_CIRCUIT_RECOVERY_SECONDS:-30}

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: api-studio-ai:local
  environment: *app-environment
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: api_studio_ai
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d api_studio_ai"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp:
    <<: *app-service
    command: ["python", "-m", "backend.scripts.run_mcp"]
    environment:
      <<: *app-environment
      MCP_BIND_HOST: 0.0.0.0
      MCP_BIND_PORT: 8001
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
